# ==============================================================================
# Starship prompt — Catppuccin Mocha powerline: connected pill segments
# (os/user → directory → git → runtime versions → time), matching
# WezTerm/Neovim/SketchyBar/JankyBorders' theme.
# https://starship.rs/config/
#
# Requires a Nerd Font (already the default in wezterm/config/fonts.lua) for
# the powerline separator glyphs and module icons to render correctly.
#
# Symlinked to ~/.config/starship.toml by setup.sh.
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

format = """
[](fg:red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:green fg:peach)\
$git_branch\
$git_status\
[](bg:teal fg:green)\
$nodejs\
$python\
$rust\
$golang\
$lua\
$terraform\
$package\
[](bg:lavender fg:teal)\
$time\
[](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
mauve = "#cba6f7"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext0 = "#a6adc8"
overlay0 = "#6c7086"
surface1 = "#45475a"
crust = "#11111b"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](mauve)"

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Macos = "󰀵"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = "[ $user ]($style)"

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 1
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
style = "bg:green fg:crust"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:green fg:crust"
format = "[($all_status$ahead_behind )]($style)"

[cmd_duration]
min_time = 2000
style = "overlay0"
format = " [$duration]($style) "

[nodejs]
style = "bg:teal fg:crust"
format = "[ $symbol($version) ]($style)"

[python]
style = "bg:teal fg:crust"
format = "[ $symbol($version) ]($style)"

[rust]
style = "bg:teal fg:crust"
format = "[ $symbol($version) ]($style)"

[golang]
style = "bg:teal fg:crust"
format = "[ $symbol($version) ]($style)"

[lua]
style = "bg:teal fg:crust"
format = "[ $symbol($version) ]($style)"

# HCL — OpenTofu/Terraform, triggered by .tf/.tfplan/.tfstate files or a
# .terraform folder. Shows the workspace, not the version (version detection
# is slow with a lot of provider plugins installed — see starship docs).
[terraform]
symbol = "💠"
style = "bg:teal fg:crust"
format = "[ $symbol( $workspace) ]($style)"

[package]
symbol = "" # cube — same glyph as sketchybar's Homebrew badge (sketchybar/icons.lua)
style = "bg:teal fg:crust"
format = "[ $symbol( $version) ]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:lavender fg:crust"
format = "[ 󰥔 $time ]($style)"

[aws]
disabled = true
[gcloud]
disabled = true
[docker_context]
disabled = true
