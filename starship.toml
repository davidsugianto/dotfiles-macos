# ==============================================================================
# Starship prompt — minimal, single-line, Catppuccin Mocha colors to match
# WezTerm/Neovim/SketchyBar/JankyBorders.
# https://starship.rs/config/
#
# Symlinked to ~/.config/starship.toml by setup.sh.
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$rust\
$golang\
$lua\
$cmd_duration\
$line_break\
$character"""

add_newline = true
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
mauve = "#cba6f7"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext0 = "#a6adc8"
overlay0 = "#6c7086"
surface1 = "#45475a"

[fill]
symbol = " "
style = "surface1"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](mauve)"

[directory]
style = "blue bold"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
style = "mauve"
symbol = " "
format = "[$symbol$branch]($style) "

[git_status]
style = "peach"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 2000
style = "overlay0"
format = "[$duration]($style) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "yellow"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "peach"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "sky"
format = "[$symbol$version]($style) "

[lua]
symbol = " "
style = "blue"
format = "[$symbol$version]($style) "

[aws]
disabled = true
[gcloud]
disabled = true
[docker_context]
disabled = true
[package]
disabled = true
