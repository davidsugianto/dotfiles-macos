# ==============================================================================
# config.yaml — k9s settings.
# Transparent Catppuccin Mocha, matching WezTerm's translucent window
# (wezterm/config/appearance.lua) and Neovim's colorscheme
# (nvim/lua/plugins/colorscheme.lua) — the terminal's own blur/opacity shows
# through instead of k9s painting an opaque background.
# ==============================================================================
k9s:
  ui:
    skin: catppuccin-mocha-transparent
  logger:
    # Wrap long log lines onto new lines instead of truncating/scrolling
    # horizontally off-screen (toggle at runtime with 'w' in the logs view).
    textWrap: true
