# Default roles — Anthropic direct via the `/login` OAuth subscription
# (pi auth.json `anthropic: oauth`), never the cekat gateway. Mirrors
# dotfiles-macos/omp/model-profiles/default.yml role-for-role (Sonnet 5.5
# everywhere except Haiku 4.5 for the cheap roles; slow/plan at high):
#
#   omp role   omp value                         pi value (this file)
#   default    sonnet-5-5:auto                   sonnet-5-5 / medium
#   smol       haiku-4-5:auto                    haiku-4-5  / medium
#   slow       sonnet-5-5:high                   sonnet-5-5 / high
#   plan       sonnet-5-5:high                   sonnet-5-5 / high
#   commit     haiku-4-5:auto                    haiku-4-5  / medium
#   task       sonnet-5-5:auto                   sonnet-5-5 / medium
#   web        sonnet-5-5:auto                   sonnet-5-5 / medium
#
# pi has no `auto` effort and custom roles can't `inherit`, so omp's `:auto`
# is pinned to `medium` here.
#
# Deploy with `pi-roles default` (dotfiles-macos/pi/scripts/pi-roles), not a
# symlink — see that script and OPERATIONS.md. Run /reload afterwards.
#
# Model IDs verified against `pi --list-models` (provider `anthropic`).
version: 1
enabled: true
selectorTimeoutMs: 8000
selectorContext: conversation
roles:
  default:
    model:
      provider: anthropic
      id: claude-sonnet-5-5
    effort: medium
  smol:
    description: >-
      Use for small, well-specified, low-risk edits or lookups with an
      explicit outcome and no design decision — typos, renames, formatting,
      one-line fixes, short factual questions.
    model:
      provider: anthropic
      id: claude-haiku-4-5
    effort: medium
  slow:
    description: >-
      Use for hard, ambiguous, or high-risk problems that need deep
      multi-step reasoning — tricky bugs, unclear requirements, security or
      correctness review, architecture trade-offs.
    model:
      provider: anthropic
      id: claude-sonnet-5-5
    effort: high
  plan:
    description: >-
      Use when the task is to produce a plan, design, or strategy before any
      code changes — breaking down multi-step work, evaluating approaches,
      writing an implementation plan.
    model:
      provider: anthropic
      id: claude-sonnet-5-5
    effort: high
  commit:
    description: >-
      Use when the task is to write or summarize a commit message, PR
      description, or changelog entry from a diff — no code changes
      requested.
    model:
      provider: anthropic
      id: claude-haiku-4-5
    effort: medium
  task:
    description: >-
      Use for ordinary delegated implementation work with a clear,
      well-scoped outcome — the default driver for everyday coding tasks
      that are neither trivial lookups nor open-ended design problems.
    model:
      provider: anthropic
      id: claude-sonnet-5-5
    effort: medium
  web:
    description: >-
      Use when the task is primarily researching or summarizing information
      from the web rather than editing code.
    model:
      provider: anthropic
      id: claude-sonnet-5-5
    effort: medium
