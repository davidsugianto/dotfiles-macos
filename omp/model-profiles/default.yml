# Default profile — mirrors modelRoles in ../config.yml (Anthropic direct), except
# slow/plan/task/web, which use Sonnet 5.5 (slow/plan at :high) instead of Opus 5 /
# Sonnet 5 / Haiku 4.5. Switch to this with `/profile default`.
modelRoles:
  default: anthropic/claude-sonnet-5-5
  smol: anthropic/claude-haiku-4-5
  slow: anthropic/claude-sonnet-5-5:high
  plan: anthropic/claude-sonnet-5-5:high
  commit: anthropic/claude-haiku-4-5
  task: anthropic/claude-sonnet-5-5
  web: anthropic/claude-sonnet-5-5
