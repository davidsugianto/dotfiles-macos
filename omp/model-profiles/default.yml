# Default profile — mirrors modelRoles in ../config.yml (Anthropic direct), except
# slow/task/web, which use Sonnet 5.5 (slow at :high) instead of Opus 5 / Sonnet 5 /
# Haiku 4.5. plan uses Opus 5.5 at :high, same as the global config. Roles without
# an explicit level use `:auto`. Switch to this with `/profile default`.
modelRoles:
  default: anthropic/claude-sonnet-5-5:auto
  smol: anthropic/claude-haiku-4-5:auto
  slow: anthropic/claude-sonnet-5-5:high
  plan: anthropic/claude-opus-5-5:high
  commit: anthropic/claude-haiku-4-5:auto
  task: anthropic/claude-sonnet-5-5:auto
  web: anthropic/claude-sonnet-5-5:auto
