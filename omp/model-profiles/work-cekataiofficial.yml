# Work profile — routes through the internal cekat LiteLLM gateway
# deployments, tiered by capability like the Anthropic profile:
#   Luna  = fast/small  -> default, smol, commit, task (primary agent and high-volume roles)
#   Sol   = deep/large   -> slow, plan (thinking-heavy work)
# The Cekat chat-completions route (`/v1/chat/completions`) rejects tool
# calls whenever any reasoning_effort value is present for gpt-6-luna/sol —
# litellm attaches its own server-side default even if the client omits the
# field, so client-side `compat.supportsReasoningEffort: false` (or forcing
# reasoning_effort to "none") does NOT help. The real fix lives in
# models.yml: `api: openai-responses` on the azure_ai/gpt-6-luna and
# azure_ai/gpt-6-sol entries, routing those two models through
# `/v1/responses` instead, which has no such restriction.
# Switch to this with `/profile work-cekataiofficial`.
modelRoles:
  default: cekat/azure_ai/gpt-6-luna
  smol: cekat/azure_ai/gpt-6-luna
  slow: cekat/azure_ai/gpt-6-sol
  plan: cekat/azure_ai/gpt-6-sol
  commit: cekat/azure_ai/gpt-6-luna
  task: cekat/azure_ai/gpt-6-luna
