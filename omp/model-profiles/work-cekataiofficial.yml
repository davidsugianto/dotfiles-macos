# Work profile — routes through the internal cekat LiteLLM gateway
# (../models.yml, $CEKAT_API_KEY) using the three internal GPT-5.6
# deployments, tiered by capability like the Anthropic profile:
#   Luna  = fast/small  -> smol, commit (cheap, high-volume roles)
#   Terra = balanced     -> default, task (everyday driver, subagents)
#   Sol   = deep/large   -> slow, plan (thinking-heavy work, :high effort)
# Switch to this with `/profile work-cekataiofficial`.
modelRoles:
  default: cekat/azure_ai/gpt-5.6-terra
  smol: cekat/azure_ai/gpt-5.6-luna
  slow: cekat/azure_ai/gpt-5.6-sol:high
  plan: cekat/azure_ai/gpt-5.6-sol:high
  commit: cekat/azure_ai/gpt-5.6-luna
  task: cekat/azure_ai/gpt-5.6-terra
