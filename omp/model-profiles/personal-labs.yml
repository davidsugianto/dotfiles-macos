# Personal profile — Anthropic direct (personal subscription/API key), same
# tiering already used as the global default in ../config.yml: Sonnet 5 for
# everyday driving, Haiku 4.5 for cheap/high-volume roles, Opus 5 (high) for
# anything that needs to think hard. Switch to this with `/profile personal-labs`.
modelRoles:
  default: anthropic/claude-sonnet-5
  smol: anthropic/claude-haiku-4-5
  slow: anthropic/claude-opus-5:high
  plan: anthropic/claude-opus-5:high
  commit: anthropic/claude-haiku-4-5
  task: anthropic/claude-sonnet-5
