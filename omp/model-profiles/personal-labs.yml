# Personal profile — Anthropic direct (personal subscription/API key). Default
# is Opus 5.5 with no thinking suffix, so it follows `defaultThinkingLevel: auto`
# from ../config.yml; Haiku 4.5 for cheap/high-volume roles. Switch to this
# with `/profile personal-labs`.
modelRoles:
  default: anthropic/claude-opus-5-5
  smol: anthropic/claude-haiku-4-5
  slow: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-opus-5-5:high
  commit: anthropic/claude-haiku-4-5
  task: anthropic/claude-sonnet-5
