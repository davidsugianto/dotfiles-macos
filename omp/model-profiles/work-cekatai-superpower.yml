# Work profile — routes through the internal cekat LiteLLM gateway
# deployments, tiered by capability like the Anthropic profile:
#   Sol   = deep/large   -> default, slow, plan, task, web (GPT-6.1 Sol almost everywhere)
#   Luna  = fast/small  -> smol, commit
# Every role runs at `:auto` effort.
# The Cekat chat-completions route (`/v1/chat/completions`) rejects tool
# calls whenever any reasoning_effort value is present for gpt-6-luna/sol —
# litellm attaches its own server-side default even if the client omits the
# field, so client-side `compat.supportsReasoningEffort: false` (or forcing
# reasoning_effort to "none") does NOT help. The real fix lives in
# models.yml: `api: openai-responses` on the azure_ai/gpt-6-luna and the
# azure_ai/gpt-6-sol / gpt-6.1-sol entries, routing those models through
# `/v1/responses` instead, which has no such restriction.
# Switch to this with `/profile work-cekatai-superpower`.
modelRoles:
  default: cekat/azure_ai/gpt-6.1-sol:auto
  smol: cekat/azure_ai/gpt-6-luna:auto
  slow: cekat/azure_ai/gpt-6.1-sol:auto
  plan: cekat/azure_ai/gpt-6.1-sol:auto
  commit: cekat/azure_ai/gpt-6-luna:auto
  task: cekat/azure_ai/gpt-6.1-sol:auto
  web: cekat/azure_ai/gpt-6.1-sol:auto
