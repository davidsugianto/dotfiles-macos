setupVersion: 2
modelRoles:
  default: anthropic/claude-sonnet-5-5:auto
  smol: anthropic/claude-haiku-4-5:auto
  slow: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-opus-5-5:high
  commit: anthropic/claude-haiku-4-5:auto
  task: anthropic/claude-sonnet-5:auto
  web: anthropic/claude-haiku-4-5:auto
defaultThinkingLevel: auto
theme:
  dark: atom-one-dark
  light: catppuccin
symbolPreset: nerd
goal:
  statusInFooter: true
statusLine:
  transparent: true
  contextLine: embedded
  compactThinkingLevel: false
  segmentOptions:
    path:
      abbreviate: true
      maxLength: 20
      stripWorkPrefix: true
  preset: default
retry:
  fallbackChains:
    web:
      - web/duckduckgo
      - web/startpage
      - web/google
      - web/parallel
      - web/perplexity
      - google/gemini-2.5-flash
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6-luna
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai/grok-4.5
      - xai-oauth/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/ecosia
      - web/mojeek
      - web/public
extendedContext: true
dev:
  autoqaConsent: granted
browser:
  relay: true
claudeResets:
  autoRedeem: "no"