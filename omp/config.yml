setupVersion: 2
modelRoles:
  default: anthropic/claude-sonnet-5-5:auto
  smol: anthropic/claude-haiku-4-5:auto
  slow: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-opus-5-5:high
  commit: anthropic/claude-haiku-4-5:auto
  task: anthropic/claude-sonnet-5-5:auto
  web: anthropic/claude-haiku-4-5:auto
defaultThinkingLevel: auto
theme:
  dark: atom-one-dark
  light: catppuccin
symbolPreset: nerd
goal:
  statusInFooter: true
statusLine:
  transparent: true
  contextLine: embedded
  compactThinkingLevel: false
  segmentOptions:
    path:
      abbreviate: true
      maxLength: 20
      stripWorkPrefix: true
  preset: default
retry:
  fallbackChains:
    web:
      - cekat/azure_ai/gpt-6.1-sol
      - cekat/azure_ai/gpt-6.1-terra
    # gpt-6-luna is no longer served to the cekat key (403): send any leftover
    # Luna request (old sessions, manual picks) to Terra.
    cekat/azure_ai/gpt-6-luna:
      - cekat/azure_ai/gpt-6.1-terra
extendedContext: true
dev:
  autoqaConsent: granted
browser:
  relay: true
claudeResets:
  autoRedeem: "no"